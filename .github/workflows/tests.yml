name: Code and lighting tests
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s functions -p 'test_*.py'
      - run: python -m compileall -q functions dashboard simulator tests
      - run: node --check dashboard/static/app.js
      - run: bash -n deploy-function.sh && bash -n deploy-dashboard.sh
